name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run on demand from the Actions tab, e.g. after a PR is retargeted to main
  # (changing a PR's base does not trigger pull_request).
  workflow_dispatch:

# The workflow only reads the repository; pull requests from forks get no
# write token either way.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pinned to ubuntu-24.04: `ubuntu-latest` is Ubuntu 26.04, for which
# @playwright/test 1.58 ships no chromium build (the E2E job fails to install
# the browser). Bump the pin together with the Playwright version.
jobs:
  ci:
    name: Build, type-check & test
    runs-on: ubuntu-24.04

    services:
      postgres:
        # Matches the production Postgres major version.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Redis for the backend tests (REDIS_URL in apps/backend/.env.test). The
      # rate-limit tests that need a live Redis fail in CI without it.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # The frontend and the console validate their VITE_* env at build time;
      # the example values are all valid placeholders, enough to let the
      # bundles build.
      - name: Provision frontend build env
        run: |
          cp apps/frontend/.env.example apps/frontend/.env
          cp apps/superadmin/.env.example apps/superadmin/.env

      - name: Build
        run: yarn build

      - name: Type-check
        run: yarn check-types

      # No dead code: unused files, exports and dependencies fail the run, as
      # they fail the pre-push hook (.githooks/pre-push).
      - name: Dead code (knip)
        run: yarn knip

      # The env schemas, the example env files, the images' build args, the
      # compose files and the deploy env files agree, and the three
      # Dockerfiles share one install (scripts/check-deploy-config.mjs).
      - name: Env and deploy files agree
        run: yarn check:deploy

      # The compose files stay valid; the example env files stand in for the
      # real ones (dev reads apps/*/.env, prod reads ./.env).
      - name: Validate compose files
        run: |
          cp apps/backend/.env.example apps/backend/.env
          docker compose -f docker-compose.dev.yml config -q
          cp deploy/prod.env.example .env
          docker compose -f docker-compose.prod.yml config -q
          cp deploy/staging.env.example .env
          docker compose -f docker-compose.prod.yml config -q
          rm .env apps/backend/.env

      # Blocking: lint is clean on main, so a red lint is the change's own.
      - name: Lint
        run: yarn lint

      # Backend tests run against NODE_ENV=test using the committed
      # apps/backend/.env.test (placeholder values, DB pointed at localhost).
      # The postgres service above matches its postgres/postgres credentials;
      # test:db:setup drops/creates/migrates/seeds the test database + schema.
      - name: Set up test database
        run: yarn test:db:setup

      - name: Run tests
        run: yarn test:run

      # The mobile app's OpenAPI document must match the user-app router.
      # A change to a user-app procedure regenerates it:
      # `NODE_ENV=test yarn workspace @connected-repo/backend gen:openapi`.
      - name: OpenAPI document is current
        run: yarn workspace @connected-repo/backend check:openapi

  # The three images Dokploy builds (either mode), built as a server builds
  # them: one BuildKit builder, backend first. The Dockerfiles check the env
  # schema against apps/backend/.env.example and boot the backend in its
  # runtime image, and `nginx -t` both nginx configs; scripts/check-images.sh
  # then checks the shared install was reused and runs the nginx images
  # (forwarded headers, security headers, the console's API surface).
  images:
    name: Docker images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build and check the images
        run: sh scripts/check-images.sh

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Drives playwright.config.ts (single worker, retries, no mobile projects)
      # and globalSetup (only the Desktop Chrome auth state → only chromium
      # needs installing).
      CI: "true"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Playwright pins a specific browser build; install just chromium (+ its
      # OS deps). Mobile projects are skipped in CI, so webkit isn't needed.
      - name: Install Playwright chromium
        run: yarn workspace @connected-repo/frontend exec playwright install --with-deps chromium

      # test:e2e:with-build (turbo) builds both apps in test mode, sets up the
      # test DB, then runs Playwright. Playwright's own `webServer` config boots
      # the backend test server + `vite preview`; `globalSetup` creates the auth
      # state. Uses the committed apps/{backend,frontend}/.env.test.
      - name: Run E2E
        run: yarn test:e2e:with-build

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/frontend/e2e/playwright-report/
          retention-days: 7
