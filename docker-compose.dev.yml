# Full local dev stack. One command boots postgres, redis, the backend (tsx
# watch), the frontend (vite dev), the superadmin console (vite dev) and an
# nginx sidecar that mirrors the production reverse-proxy layout, so the
# browser hits /api/*, /mcp and the OAuth /.well-known/* documents on the same
# origin as the SPA.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up                 → boot everything
#   docker compose -f docker-compose.dev.yml up postgres redis  → services only, for host-mode `yarn dev`
#   docker compose -f docker-compose.dev.yml down               → stop
#   docker compose -f docker-compose.dev.yml down -v            → also wipe the data volumes
#
# Before the first `up`, copy the three example env files (README.md):
# apps/backend/.env, apps/frontend/.env and apps/superadmin/.env.
# If you customized DB_NAME/DB_USER/DB_PASSWORD in apps/backend/.env, invoke
# with `--env-file apps/backend/.env` so the compose-side ${DB_*} placeholders
# below resolve to your values (otherwise the .env.example defaults are used).
#
# First boot: postgres bootstraps an empty $DB_NAME database; db-migrate builds
# the shared packages, runs `yarn db up` + `yarn db seed`; then the backend,
# the frontend and the console start. Later boots skip the seed
# (apps/backend/scripts/dev-db-init.sh).
#
# Ports (all bound to 127.0.0.1, so a dev backend is never exposed):
#   8080  → nginx (the production-like entrypoint: open this in your browser)
#   5173  → Vite dev server, frontend (direct)
#   5175  → Vite dev server, superadmin console (its own proxy to the backend)
#   3000  → backend (direct)
#   5432  → postgres (for database tools)
#   6379  → redis
#
# A host-mode postgres or redis on :5432 or :6379 clashes with these ports:
# stop it first.

x-backend-dev: &backend-dev
  build:
    context: .
    dockerfile: apps/backend/Dockerfile.dev
  env_file:
    - apps/backend/.env
  volumes:
    - .:/app
    - backend_node_modules:/app/node_modules
    - backend_apps_backend_node_modules:/app/apps/backend/node_modules
  networks:
    - dev-network

services:
  postgres:
    # Matches the production and CI Postgres major version.
    image: postgres:18-alpine
    container_name: connected_repo_dev_postgres
    restart: unless-stopped
    env_file:
      - apps/backend/.env
    environment:
      # POSTGRES_DB tells the postgres image to CREATE this database on the
      # very first boot (when the data volume is empty). That's the "fresh
      # database" trigger; db-migrate then runs migrations + seed against it.
      # The values fall back to the .env.example defaults so `up` works on a
      # fresh clone.
      POSTGRES_DB: ${DB_NAME:-connected_repo_orpc_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/18/docker
      # and refuse a volume mounted at the old /var/lib/postgresql/data.
      - postgres_dev_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-connected_repo_orpc_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dev-network

  redis:
    image: redis:7-alpine
    container_name: connected_repo_dev_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dev-network

  # One-shot bootstrap: waits for postgres, builds the shared packages (the
  # backend's tsx and both Vite apps import @connected-repo/* from dist), runs
  # migrations, seeds if fresh. Exits 0 on success; the backend waits for it.
  db-migrate:
    <<: *backend-dev
    container_name: connected_repo_dev_db_migrate
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    working_dir: /app
    command: >
      sh -c "yarn install --frozen-lockfile &&
             npx turbo run build --filter='./packages/*' &&
             sh apps/backend/scripts/dev-db-init.sh"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend-dev
    container_name: connected_repo_dev_backend
    restart: unless-stopped
    environment:
      # Override the .env hosts so we reach the SERVICES, not localhost.
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      # All interfaces, so the nginx sidecar can reach us.
      HOST: 0.0.0.0
      PORT: "3000"
      # The browser talks to nginx on :8080, so redirects and CORS match it;
      # the console's dev server is its own origin.
      WEBAPP_URL: http://localhost:8080
      VITE_API_URL: http://localhost:8080
      ALLOWED_ORIGINS: http://localhost:8080,http://localhost:5173,http://localhost:5175
      # The nginx sidecar is the one proxy in front (apps/frontend/nginx.dev.conf).
      TRUSTED_PROXY_COUNT: "1"
    ports:
      - "127.0.0.1:3000:3000"
    working_dir: /app/apps/backend
    command: >
      sh -c "yarn --cwd /app install --frozen-lockfile &&
             yarn dev"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
    container_name: connected_repo_dev_frontend
    restart: unless-stopped
    env_file:
      - apps/frontend/.env
    environment:
      NODE_ENV: development
      # Empty VITE_API_URL = the client calls same-origin /api/*; nginx routes it.
      VITE_API_URL: ""
      VITE_USER_APP_URL: ""
      VITE_USER_NODE_ENV: development
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_apps_frontend_node_modules:/app/apps/frontend/node_modules
    working_dir: /app/apps/frontend
    # --host 0.0.0.0 so nginx can reach us; --port matches EXPOSE in Dockerfile.dev.
    command: >
      sh -c "yarn --cwd /app install --frozen-lockfile &&
             yarn dev --host 0.0.0.0 --port 5173"
    depends_on:
      backend:
        condition: service_started
    networks:
      - dev-network

  # The console on its own origin; its Vite proxy forwards /api/* to the
  # backend (VITE_DEV_BACKEND_PROXY_TARGET). Its own node_modules volumes: two
  # `yarn install`s must never share one.
  superadmin:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
    container_name: connected_repo_dev_superadmin
    restart: unless-stopped
    env_file:
      - apps/superadmin/.env
    environment:
      NODE_ENV: development
      VITE_API_URL: ""
      VITE_USER_NODE_ENV: development
      VITE_DEV_BACKEND_PROXY_TARGET: http://backend:3000
    ports:
      - "127.0.0.1:5175:5175"
    volumes:
      - .:/app
      - superadmin_node_modules:/app/node_modules
      - superadmin_apps_superadmin_node_modules:/app/apps/superadmin/node_modules
    working_dir: /app/apps/superadmin
    command: >
      sh -c "yarn --cwd /app install --frozen-lockfile &&
             yarn dev --host 0.0.0.0 --port 5175"
    depends_on:
      backend:
        condition: service_started
    networks:
      - dev-network

  # Mimics production: / → SPA; /api/*, /mcp and the OAuth /.well-known/* →
  # backend. Same origin, no CORS, cookies stay first-party.
  nginx:
    image: nginx:1.27-alpine
    container_name: connected_repo_dev_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./apps/frontend/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - dev-network

volumes:
  postgres_dev_data:
  redis_dev_data:
  # Named volumes shadow the bind mount so host node_modules (which may be
  # built for another architecture, e.g. an arm64 Mac vs an x86 container)
  # never leak in.
  backend_node_modules:
  backend_apps_backend_node_modules:
  frontend_node_modules:
  frontend_apps_frontend_node_modules:
  superadmin_node_modules:
  superadmin_apps_superadmin_node_modules:

networks:
  dev-network:
    driver: bridge
